<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swarali Pro Dashboard - Editable</title>
    <style>
        body { background-color: #1E222D; color: #ffffff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 20px;}
        .settings-box { background-color: #2A2E39; padding: 15px; border-radius: 6px; max-width: 900px; margin: 0 auto 20px auto; display: flex; justify-content: space-around; align-items: center; border: 1px solid #363A45;}
        .settings-box label { font-size: 13px; color: #9598A1; }
        .settings-box select, .settings-box input { background: #1E222D; color: #fff; border: 1px solid #363A45; padding: 5px 10px; border-radius: 4px; }
        
        table { width: 100%; max-width: 900px; margin: 0 auto; border-collapse: collapse; background-color: #1E222D; font-size: 14px;}
        th, td { padding: 10px; border: 1px solid #363A45; }
        th { background-color: #2A2E39; font-weight: bold; color: #D1D4DC; }
        
        .bg-green { background-color: rgba(8, 153, 129, 0.4); color: #00FF00; font-weight: bold; }
        .bg-red { background-color: rgba(242, 54, 69, 0.4); color: #FF5252; font-weight: bold; }
        .bg-dark { background-color: #2A2E39; color: #D1D4DC; }
        .sym-col { font-weight: bold; text-align: left; background-color: #1E222D; color: #E1E3EB; }
    </style>
</head>
<body>
    <h2 style="color: #089981; margin-bottom: 5px;">Swarali RSI 4 Lines Dashboard [LIVE]</h2>
    <p style="color: #9598A1; font-size: 13px; margin-bottom: 20px;">Editable Bybit Scanner & Ranking System</p>

    <!-- Editable Settings Panel -->
    <div class="settings-box">
        <div>
            <label>Timeframe:</label><br>
            <select id="timeframeSelect" onchange="updateSettings()">
                <option value="1">1m</option>
                <option value="5" selected>5m</option>
                <option value="15">15m</option>
                <option value="60">1h</option>
            </select>
        </div>
        <div>
            <label>Min ADX Filter:</label><br>
            <input type="number" id="minAdx" value="20" min="10" max="50" style="width: 60px;" onchange="updateSettings()">
        </div>
        <div>
            <label>Auto-Refresh:</label><br>
            <span style="color: #089981; font-weight: bold;">Active (10s)</span>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>SYM</th>
                <th>RSI</th>
                <th>ADX</th>
                <th>DEL (CVD)</th>
                <th>RNK</th>
                <th>PRC@TIME</th>
            </tr>
        </thead>
        <tbody id="data-table">
            <tr><td colspan="6">Fetching Market Data from Bybit...</td></tr>
        </tbody>
    </table>

    <script>
        const API_URL = '/api/signals';

        function updateSettings() {
            console.log("Settings updated locally.");
        }

        async function fetchMarketData() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                let rows = '';
                
                result.data.forEach(item => {
                    let rnkClass = 'bg-dark';
                    if (item.rnk.includes('B')) rnkClass = 'bg-green';
                    else if (item.rnk.includes('S')) rnkClass = 'bg-red';
                    
                    let cvdClass = item.cvd.includes('-') ? 'bg-red' : 'bg-green';
                    let rsiClass = item.rsi > 60 ? 'bg-red' : (item.rsi < 40 ? 'bg-green' : 'bg-dark');

                    rows += `<tr>
                        <td class="sym-col">${item.sym}</td>
                        <td class="${rsiClass}">${item.rsi}</td>
                        <td>${item.adx}</td>
                        <td class="${cvdClass}">${item.cvd}</td>
                        <td class="${rnkClass}">${item.rnk}</td>
                        <td>${item.prc_time}</td>
                    </tr>`;
                });
                document.getElementById('data-table').innerHTML = rows;
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        fetchMarketData();
        setInterval(fetchMarketData, 10000);
    </script>
</body>
</html>
