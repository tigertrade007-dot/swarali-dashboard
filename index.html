<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swarali 4-Lines Dashboard</title>
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 20px;
        }
        h1 { color: #00e676; margin-bottom: 5px; }
        p { color: #aaaaaa; font-size: 14px; margin-bottom: 20px; }
        table { 
            width: 95%; 
            max-width: 800px; 
            margin: 0 auto; 
            border-collapse: collapse; 
            background-color: #1e1e1e;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td { 
            padding: 15px; 
            border-bottom: 1px solid #333; 
        }
        th { 
            background-color: #2c2c2c; 
            font-weight: bold;
            letter-spacing: 1px;
        }
        tr:hover { background-color: #2a2a2a; }
        .buy { color: #00e676; font-weight: bold; font-size: 16px; }
        .sell { color: #ff3d00; font-weight: bold; font-size: 16px; }
        .wait { color: #777777; }
        .coin-name { font-weight: bold; color: #ffeb3b; }
    </style>
</head>
<body>

    <h1>Swarali Live Scanner</h1>
    <p>Auto-refreshing every 30 seconds...</p>

    <table>
        <thead>
            <tr>
                <th>COIN</th>
                <th>PRICE</th>
                <th>RSI (14)</th>
                <th>SIGNAL</th>
            </tr>
        </thead>
        <tbody id="data-table">
            <tr><td colspan="4">Fetching live market data... Please wait</td></tr>
        </tbody>
    </table>

    <script>
        // Yahan aapka poora aur sahi Render URL daal diya gaya hai
        const API_URL = 'https://swarali-asia.onrender.com/api/signals';

        async function fetchMarketData() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                let rows = '';
                result.data.forEach(item => {
                    let signalClass = 'wait';
                    if (item.signal === 'ss.b') signalClass = 'buy';
                    if (item.signal === 'ss.s') signalClass = 'sell';
                    
                    rows += `<tr>
                        <td class="coin-name">${item.coin}</td>
                        <td>${item.price}</td>
                        <td>${item.rsi}</td>
                        <td class="${signalClass}">${item.signal}</td>
                    </tr>`;
                });
                
                document.getElementById('data-table').innerHTML = rows;
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('data-table').innerHTML = `<tr><td colspan="4" style="color:red;">Error loading data. Retrying...</td></tr>`;
            }
        }

        // Pehli baar turant load karein
        fetchMarketData();
        // Phir har 30 second me refresh karein
        setInterval(fetchMarketData, 30000);
    </script>

</body>
</html>
