<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swarali RSI 4 Lines - Pro Dashboard</title>
    <style>
        body { background-color: #12161C; color: #D1D4DC; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; text-align: center; }
        h2 { color: #089981; margin-bottom: 5px; }
        
        /* Settings Panel Styling */
        .settings-container { background-color: #1E222D; border: 1px solid #363A45; border-radius: 8px; max-width: 900px; margin: 0 auto 20px auto; padding: 15px; text-align: left; }
        .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 10px; }
        .setting-item { background: #2A2E39; padding: 8px 12px; border-radius: 4px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .setting-item label { color: #B2B5BE; cursor: pointer; }
        .setting-item input[type="checkbox"] { transform: scale(1.2); cursor: pointer; }
        
        .toggle-btn { background-color: #2962FF; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .toggle-btn:hover { background-color: #1e4bd8; }
        
        #settings-body { display: none; }

        /* Dashboard Table Styling */
        table { width: 100%; max-width: 900px; margin: 0 auto; border-collapse: collapse; background-color: #1E222D; font-size: 13px; border-radius: 6px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        th, td { padding: 10px 8px; border-bottom: 1px solid #363A45; }
        th { background-color: #2A2E39; font-weight: bold; color: #D1D4DC; }
        tr:hover { background-color: #252833; }
        
        .bg-green { background-color: rgba(8, 153, 129, 0.4); color: #00FF00; font-weight: bold; }
        .bg-red { background-color: rgba(242, 54, 69, 0.4); color: #FF5252; font-weight: bold; }
        .bg-dark { background-color: #1E222D; color: #D1D4DC; }
        .sym-col { font-weight: bold; text-align: left; color: #F0F3FA; }
    </style>
</head>
<body>

    <h2>Swarali RSI 4 Lines Dashboard [LIVE]</h2>
    <p style="color: #848E9C; font-size: 12px; margin-bottom: 15px;">Rank & Scoring Conditions Control Panel</p>

    <!-- Collapsible Settings Panel -->
    <button class="toggle-btn" onclick="toggleSettings()">🏆 Toggle Rank & Scoring Conditions</button>
    
    <div class="settings-container" id="settings-body">
        <h3 style="color: #089981; margin-top: 0; font-size: 15px; border-bottom: 1px solid #363A45; padding-bottom: 5px;">Rank & Scoring Conditions</h3>
        <div class="group-grid">
            <div class="setting-item">
                <label for="chkCvd">Count CVD (Delta) Point</label>
                <input type="checkbox" id="chkCvd" checked onchange="fetchMarketData()">
            </div>
            <div class="setting-item">
                <label for="chkVwap">Count VWAP Point</label>
                <input type="checkbox" id="chkVwap" checked onchange="fetchMarketData()">
            </div>
            <div class="setting-item">
                <label for="chkOim">Count OIM Point</label>
                <input type="checkbox" id="chkOim" checked onchange="fetchMarketData()">
            </div>
            <div class="setting-item">
                <label for="chkAdx">Count ADX (>20) Point</label>
                <input type="checkbox" id="chkAdx" checked onchange="fetchMarketData()">
            </div>
            <div class="setting-item">
                <label for="chkReqVol">Require Daily Vol Break (SS)</label>
                <input type="checkbox" id="chkReqVol" checked onchange="fetchMarketData()">
            </div>
            <div class="setting-item">
                <label for="chkReqRsi">Require RSI Break (SS)</label>
                <input type="checkbox" id="chkReqRsi" onchange="fetchMarketData()">
            </div>
            <div class="setting-item">
                <label for="chkStar">Show High-Timeframe EMA Star (★)</label>
                <input type="checkbox" id="chkStar" checked onchange="fetchMarketData()">
            </div>
        </div>
    </div>

    <!-- Live Scanner Table -->
    <table>
        <thead>
            <tr>
                <th>SYM</th>
                <th>RSI</th>
                <th>ADX</th>
                <th>DEL (CVD)</th>
                <th>RNK</th>
                <th>PRC@TIME</th>
            </tr>
        </thead>
        <tbody id="data-table">
            <tr><td colspan="6">Fetching Market Data from Bybit...</td></tr>
        </tbody>
    </table>

    <script>
        function toggleSettings() {
            var x = document.getElementById("settings-body");
            x.style.display = (x.style.display === "block") ? "none" : "block";
        }

        async function fetchMarketData() {
            const useCvd = document.getElementById('chkCvd').checked;
            const useVwap = document.getElementById('chkVwap').checked;
            const useOim = document.getElementById('chkOim').checked;
            const useAdx = document.getElementById('chkAdx').checked;
            const reqVol = document.getElementById('chkReqVol').checked;
            const reqRsi = document.getElementById('chkReqRsi').checked;
            const showStar = document.getElementById('chkStar').checked;

            const queryParams = new URLSearchParams({
                use_cvd: useCvd,
                use_vwap: useVwap,
                use_oim: useOim,
                use_adx: useAdx,
                req_vol: reqVol,
                req_rsi: reqRsi,
                show_star: showStar
            });

            try {
                const response = await fetch(`/api/signals?${queryParams.toString()}`);
                const result = await response.json();
                let rows = '';
                
                if (result.data && result.data.length > 0) {
                    result.data.forEach(item => {
                        let rnkClass = 'bg-dark';
                        if (item.rnk.includes('B')) rnkClass = 'bg-green';
                        else if (item.rnk.includes('S')) rnkClass = 'bg-red';
                        
                        let cvdClass = item.cvd.includes('-') ? 'bg-red' : 'bg-green';
                        let rsiClass = item.rsi > 60 ? 'bg-red' : (item.rsi < 40 ? 'bg-green' : 'bg-dark');

                        rows += `<tr>
                            <td class="sym-col">${item.sym}</td>
                            <td class="${rsiClass}">${item.rsi}</td>
                            <td>${item.adx}</td>
                            <td class="${cvdClass}">${item.cvd}</td>
                            <td class="${rnkClass}">${item.rnk}</td>
                            <td>${item.prc_time}</td>
                        </tr>`;
                    });
                    document.getElementById('data-table').innerHTML = rows;
                } else {
                    document.getElementById('data-table').innerHTML = `<tr><td colspan="6">Scanning coins... Please wait.</td></tr>`;
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        fetchMarketData();
        setInterval(fetchMarketData, 10000);
    </script>
</body>
</html>
